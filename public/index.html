<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0814">
  <meta name="description" content="Xの投稿を集め、夜職の業界把握と投稿ネタ探しに使うツール">
  <title>X-trend</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へスキップ</a>
  <div id="banners" class="banners" aria-live="polite"></div>
  <div class="shell">
    <header class="topbar">
      <a class="logo" href="#/feed" aria-label="X-trend ホーム（フィード）">
        <span class="logo-x" aria-hidden="true">X</span><span class="logo-dash" aria-hidden="true">-</span><span class="logo-trend" aria-hidden="true">trend</span>
      </a>
      <div id="topbar-status" class="topbar-status"></div>
    </header>
    <nav class="nav" aria-label="メインメニュー">
      <ul id="nav-list" class="nav-list"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1">
      <div id="view" class="view"></div>
    </main>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">このアプリの表示には JavaScript が必要です。</p></noscript>
</body>
</html>
